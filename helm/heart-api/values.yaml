replicaCount: 2

image:
  repository: heart-disease-api
  tag: latest
  pullPolicy: IfNotPresent

modelVersion: "1.0.0"

service:
  type: LoadBalancer
  port: 8030

ingress:
  enabled: false
  className: nginx
  host: heart-api.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
